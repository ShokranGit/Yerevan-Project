<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Yerevan Project — An Interactive Research Map</title>
<meta name="description" content="Mapping urban space, social movements, and political events in Yerevan, Armenia." />
<link rel="preconnect" href="https://basemaps.cartocdn.com" />
<link href="assets/vendor/maplibre-gl.css" rel="stylesheet" />
<link href="assets/css/styles.css?v=20260821h" rel="stylesheet" />
</head>
<body>

<div id="app">

  <!-- ============ LEFT PANEL ============ -->
  <aside id="panel">

    <header id="panel-head">
      <div class="brand">
        <h1>Yerevan Project</h1>
        <p class="brand-sub">Urban space · social movements · political events</p>
      </div>
      <button id="panel-toggle" class="icon-btn" title="Collapse panel" aria-label="Collapse panel">&#10094;</button>
    </header>

    <!-- ---- VIEW A: browse / filter ---- -->
    <div id="browse-view">

      <div class="field">
        <input id="search" type="search" placeholder="Search events, places, actors…" autocomplete="off" />
      </div>

      <section class="block">
        <div class="block-head">
          <h2>Themes</h2>
          <button id="cat-all" class="link-btn">all</button>
          <button id="cat-none" class="link-btn">none</button>
        </div>
        <div id="categories"></div>
      </section>

      <section class="block">
        <div class="block-head">
          <h2>Results <span id="result-count" class="count">0</span></h2>
          <select id="sort" title="Sort results">
            <option value="date-asc">Oldest first</option>
            <option value="date-desc">Newest first</option>
            <option value="title">A–Z</option>
          </select>
        </div>
        <ul id="results"></ul>
      </section>

    </div>

    <!-- ---- VIEW B: single event detail ---- -->
    <article id="detail-view" hidden>
      <button id="detail-back" class="back-btn">&#10094; Back to all events</button>
      <div id="detail-body"></div>
    </article>

  </aside>

  <!-- ============ MAP ============ -->
  <main id="map-wrap">
    <div id="map"></div>

    <!-- north arrow: rotates with the map, click to face north again -->
    <button id="north" title="Reset bearing to north" aria-label="Reset bearing to north">
      <svg viewBox="0 0 40 52" aria-hidden="true">
        <polygon class="n-dark" points="20,3 30,44 20,35"/>
        <polygon class="n-light" points="20,3 10,44 20,35"/>
        <text class="n-label" x="20" y="51" text-anchor="middle">N</text>
      </svg>
    </button>

    <!-- Picked coordinate sits directly above the readout it came from. -->
    <div id="pick-out" hidden>
      <code id="pick-val"></code>
      <button id="pick-copy">Copy</button>
      <button id="pick-clear" title="Clear">&#215;</button>
    </div>

    <div id="coords" aria-live="off">
      <button id="pick-btn" type="button" aria-pressed="false" title="Pick a coordinate from the map">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="4.2" fill="none" stroke="currentColor" stroke-width="1.3"/>
          <path d="M8 0v3.2M8 12.8V16M0 8h3.2M12.8 8H16" stroke="currentColor" stroke-width="1.3"/>
        </svg>
      </button>
      <span id="coord-lat">—</span><span id="coord-lng">—</span><span id="coord-zoom"></span>
      <span id="scale"><i id="scale-bar"></i><b id="scale-label">—</b></span>
    </div>

    <div id="map-controls">
      <select class="map-select" id="basemap-select" title="Basemap" aria-label="Basemap"></select>
      <button class="map-btn" id="reset-btn" title="Reset view">Reset view</button>
      <button class="map-btn" id="about-btn" title="About this map">About</button>
    </div>

    <!-- ---- THE RELATIONAL MODEL, IN 3D ----
         A thumbnail that turns by itself; click it for the full window. -->
    <button id="g3-thumb" type="button" title="The relational model in 3D">
      <canvas id="g3-thumb-canvas"></canvas>
      <b>The model</b>
    </button>

    <div id="g3-modal" hidden>
      <div class="g3-shell">
        <div class="g3-stage">
          <canvas id="g3-canvas"></canvas>
          <div class="g3-head">
            <div>
              <h2>The relational model</h2>
              <p>Drag to turn it, scroll to zoom, click a node to see what the map holds.</p>
            </div>
            <div style="display:flex;gap:6px">
              <button class="map-btn" id="g3-reset" type="button">Reset</button>
              <button class="map-btn" id="g3-close" type="button">Close</button>
            </div>
          </div>
          <div id="g3-legend"></div>
        </div>
        <aside class="g3-side" id="g3-info"></aside>
      </div>
    </div>

    <!-- ---- TIMELINE ---- -->
    <div id="timeline">
      <div class="tl-row">
        <button id="play-btn" class="play-btn" title="Play through time" aria-label="Play">&#9654;</button>
        <div class="tl-label">
          <span id="tl-from">—</span>
          <span class="tl-dash">→</span>
          <span id="tl-to">—</span>
        </div>
        <button id="tl-reset" class="link-btn">full range</button>
      </div>
      <div class="tl-slider">
        <div id="tl-track"></div>
        <div id="tl-fill"></div>
        <div id="tl-density"></div>
        <input type="range" id="tl-start" min="0" max="100" value="0" step="1" aria-label="Start of time window" />
        <input type="range" id="tl-end" min="0" max="100" value="100" step="1" aria-label="End of time window" />
      </div>
      <div id="tl-ticks"></div>

      <!-- the long view: one century, by decade -->
      <div class="tl-sep"></div>
      <div class="tl-row tl-row-century">
        <span class="tl-era">The century</span>
        <div class="tl-label">
          <span id="cn-from">—</span>
          <span class="tl-dash">→</span>
          <span id="cn-to">—</span>
        </div>
        <button id="cn-reset" class="link-btn">full century</button>
      </div>
      <div class="tl-slider tl-slider-century">
        <div id="cn-track"></div>
        <div id="cn-fill"></div>
        <div id="cn-density"></div>
        <input type="range" id="cn-start" min="0" max="1000" value="0" step="1" aria-label="Start of century window" />
        <input type="range" id="cn-end" min="0" max="1000" value="1000" step="1" aria-label="End of century window" />
      </div>
      <div id="cn-ticks"></div>
    </div>
  </main>

</div>

<!-- ============ ABOUT MODAL ============ -->
<div id="about-modal" class="modal" hidden>
  <div class="modal-card">
    <button id="about-close" class="modal-close" aria-label="Close">&times;</button>
    <h2>About this map</h2>
    <div id="about-body"></div>
  </div>
</div>

<div id="loading">Loading map…</div>

<script src="assets/vendor/maplibre-gl.js"></script>
<!-- ?v= is bumped on every deploy: GitHub Pages caches assets hard,
     and without it readers keep running yesterday's code. -->
<script src="assets/js/app.js?v=20260821h"></script>
<script src="assets/js/picker.js?v=20260821h"></script>
<script src="assets/js/terrain.js?v=20260821h"></script>
<script src="assets/js/graph3d.js?v=20260821h"></script>
</body>
</html>
